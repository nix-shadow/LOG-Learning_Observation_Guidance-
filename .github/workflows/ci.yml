name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-non-production-secret-0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        # golangci-lint v2.x requires golangci-lint-action v7+ (v6 rejects it).
        # `uses:` steps ignore defaults.run.working-directory, so the module
        # dir must be passed via the action's own input.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          working-directory: backend

      - name: Test (isolated temp DB)
        run: go test ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must be >= 22: jest.setup.ts injects Node's webcrypto.subtle into
          # jsdom, and Node 20 rejects cross-realm buffers ("2nd argument is
          # not instance of ArrayBuffer"). Dev machines run Node 22+.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Jest (offline sync layer)
        run: npx jest

      - name: Build + RESPECT budget check (WP-4.2)
        run: node scripts/check-budget.mjs
        env:
          NEXT_PUBLIC_API_URL: http://localhost:6101/api/v1

  hygiene:
    name: Git hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No build artifacts tracked
        run: |
          if git ls-files | grep -E '(^|/)(sw\.js|workbox-[^/]*\.js|log\.db|server)$'; then
            echo "Generated/build artifacts are tracked in git — remove them." >&2
            exit 1
          fi

      - name: No .env files tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A real .env file is tracked — copy from .env.example instead." >&2
            exit 1
          fi