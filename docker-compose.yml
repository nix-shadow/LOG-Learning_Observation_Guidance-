version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "6001:6001"
    environment:
      - PORT=6001
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:6000}
      # Secret is injected from the environment — never commit a real value.
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your .env (see .env.example)}
    volumes:
      - log_data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "6000:6000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:6001/api
    depends_on:
      - backend

volumes:
  log_data:
